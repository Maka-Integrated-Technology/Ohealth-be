version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 0
    rebase-strategy: "auto"
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      npm-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
