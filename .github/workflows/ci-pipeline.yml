name: CI Pipeline

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main, feat/75-challenge-delivery-foundation]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.pull_request.base.ref == 'dev' ||
      github.event.pull_request.base.ref == 'staging' ||
      github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'feat/75-challenge-delivery-foundation'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ohealth_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ohealth_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run supply-chain security scan
        shell: bash
        run: bash scripts/security/supply-chain-scan.sh

      - name: Verify supply-chain scanner controls
        shell: bash
        run: bash scripts/security/supply-chain-scan.test.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Verify pinned compromised-password dataset
        run: npm run password-blocklist:check

      - name: Check generated contract drift
        run: npm run contract:check

      - name: Install pinned API compatibility checker
        env:
          OASDIFF_INSTALL_DIR: ${{ runner.temp }}/oasdiff/bin
        run: |
          bash scripts/openapi/install-oasdiff.sh
          echo "${OASDIFF_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Validate canonical API contract
        run: npm run contract:validate

      - name: Verify contract compatibility controls
        run: npm run contract:compatibility:test

      - name: Verify generated API client
        run: npm run api-client:test

      - name: Analyze API contract changes
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        id: contract_compatibility
        env:
          BASE_CONTRACT: ${{ github.event.pull_request.base.sha }}:contracts/openapi.json
          CONTRACT_REPORT: ${{ runner.temp }}/api-contract-report.md
        run: |
          bash scripts/openapi/analyze-contract-change.sh \
            "${BASE_CONTRACT}" \
            contracts/openapi.json \
            "${CONTRACT_REPORT}"

      - name: Verify operator delivery command input and formatting
        run: |
          npx prettier --check scripts/maintenance/dispatch-auth-challenge-deliveries.ts
          npx prettier --check scripts/maintenance/check-oauth-security-notification-runtime.cjs
          npx prettier --check scripts/maintenance/prune-registration-retries.ts
          npx prettier --check src/workers/oauth-security-notifications.ts
          check_invalid_usage() {
            set +e
            result=$(npm run auth-challenge-delivery:dispatch -- "$@" 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ] || ! printf '%s\n' "$result" | grep -qx 'Invalid challenge delivery dispatch arguments.'; then
              printf 'Delivery dispatch did not reject invalid arguments before database access.\n' >&2
              exit 1
            fi
          }
          check_invalid_usage --batch-size=0
          check_invalid_usage --batch-size=11
          check_invalid_usage --batch-size=NaN
          check_invalid_usage --unknown
          check_invalid_usage --batch-size=1 --batch-size=2
          check_invalid_prune_usage() {
            set +e
            result=$(npm run registration-retries:prune -- "$@" 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ] || ! printf '%s\n' "$result" | grep -qx 'Invalid registration retry prune arguments.'; then
              printf 'Registration retry prune did not reject invalid arguments before database access.\n' >&2
              exit 1
            fi
          }
          check_invalid_prune_usage --batch-size=0
          check_invalid_prune_usage --batch-size=501
          check_invalid_prune_usage --batch-size=NaN
          check_invalid_prune_usage --unknown
          check_invalid_prune_usage --batch-size=1 --batch-size=2
          check_invalid_oauth_notification_usage() {
            set +e
            result=$(npm run oauth-security-notifications:dispatch -- "$@" 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ] || ! printf '%s\n' "$result" | grep -qx 'Invalid OAuth security notification dispatch arguments.'; then
              printf 'OAuth notification dispatch did not reject invalid arguments before database access.\n' >&2
              exit 1
            fi
          }
          check_invalid_oauth_notification_usage --batch-size=0
          check_invalid_oauth_notification_usage --batch-size=101
          check_invalid_oauth_notification_usage --interval-seconds=5
          check_invalid_oauth_notification_usage --unknown
          check_invalid_oauth_notification_usage --continuous --continuous

      - name: Verify formatting
        run: npm run format:check

      - name: Run non-mutating ESLint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Verify maintenance worker TypeScript and ESLint
        run: |
          npx tsc --noEmit -p tsconfig.worker.json
          npx eslint scripts/maintenance/dispatch-auth-challenge-deliveries.ts
          npx eslint scripts/maintenance/prune-registration-retries.ts

      - name: Run Tests
        run: npm test

      - name: Verify denied legacy activation (isolated e2e)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/auth-activation.e2e-spec.ts

      - name: Verify credential enumeration resistance (isolated e2e)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/auth-login-enumeration.e2e-spec.ts

      - name: Verify purpose-bound public auth contracts (isolated HTTP e2e)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/auth-challenge-public.e2e-spec.ts

      - name: Verify public Google OAuth abuse and completion boundaries (isolated HTTP e2e)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/oauth-google-public.e2e-spec.ts

      - name: Verify public discovery boundary (isolated HTTP e2e)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/public-discovery-boundary.e2e-spec.ts

      - name: Verify public speciality catalogue (isolated HTTP e2e)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/public-speciality-catalogue.e2e-spec.ts

      - name: Run Build
        run: npm run build

      - name: Verify deployed worker image and email rendering
        env:
          OAUTH_WORKER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ohealth_oauth_worker_ci
          POSTGRES_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          node -e 'const {Client}=require("pg");(async()=>{const c=new Client({connectionString:process.env.POSTGRES_ADMIN_URL});await c.connect();await c.query("CREATE DATABASE ohealth_oauth_worker_ci");await c.end()})().catch(()=>process.exit(1))'
          DATABASE_URL="${OAUTH_WORKER_DATABASE_URL}" npm run migration:run
          docker build -f deploy/auth-challenge-worker/Dockerfile -t ohealth-auth-worker:ci .
          docker run --rm --entrypoint node ohealth-auth-worker:ci scripts/maintenance/check-worker-templates.cjs
          docker run --rm --network host \
            -e DATABASE_URL="${OAUTH_WORKER_DATABASE_URL}" \
            -e MAIL_MAILER=smtp \
            -e MAIL_FROM_ADDRESS=worker@example.invalid \
            --entrypoint node \
            ohealth-auth-worker:ci \
            scripts/maintenance/check-oauth-security-notification-runtime.cjs
          docker run --detach --name ohealth-oauth-notification-worker-ci \
            --network host \
            -e DATABASE_URL="${OAUTH_WORKER_DATABASE_URL}" \
            -e MAIL_MAILER=smtp \
            -e MAIL_FROM_ADDRESS=worker@example.invalid \
            ohealth-auth-worker:ci \
            npm run oauth-security-notifications:dispatch:prod -- \
              --continuous --batch-size=20 --interval-seconds=1
          sleep 3
          docker exec ohealth-oauth-notification-worker-ci node -e \
            "const fs=require('node:fs');const p='/tmp/ohealth-oauth-notification-worker-heartbeat';process.exit(fs.existsSync(p)&&Date.now()-fs.statSync(p).mtimeMs<10000?0:1)"
          docker stop ohealth-oauth-notification-worker-ci
          docker rm ohealth-oauth-notification-worker-ci
          node -e 'const {Client}=require("pg");(async()=>{const c=new Client({connectionString:process.env.POSTGRES_ADMIN_URL});await c.connect();await c.query("DROP DATABASE ohealth_oauth_worker_ci");await c.end()})().catch(()=>process.exit(1))'

      - name: Verify account lifecycle migration on real PostgreSQL
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/canonical-account-lifecycle.integration.spec.ts

      - name: Verify auth security audit foundation on PostgreSQL
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/auth-security-audit.integration.spec.ts

      - name: Verify canonical Google OAuth migration on PostgreSQL
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/canonical-google-oauth-migration.integration.spec.ts

      - name: Verify auth challenge foundation on PostgreSQL
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/auth-challenge.integration.spec.ts

      - name: Verify live challenge HTTP and PostgreSQL acceptance
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/auth-challenge-live-http.integration.spec.ts

      - name: Verify delivery lease safety across independent PostgreSQL connections
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/auth-challenge-delivery-concurrency.integration.spec.ts

      - name: Verify public discovery visibility on real PostgreSQL
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/public-discovery-visibility.integration.spec.ts

      - name: Verify public speciality catalogue on real PostgreSQL
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/public-speciality-catalogue.integration.spec.ts

      - name: Verify recovered patient profile address and persistence
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/patient-personal-address.integration.spec.ts src/database/tests/canonical-patient-personal-profile.integration.spec.ts

      - name: Enforce breaking-change approval
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          APPROVAL_LABEL_PRESENT: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking-change-approved') }}
          BREAKING_CHANGES: ${{ steps.contract_compatibility.outputs.breaking_changes }}
          CONTRACT_REPORT: ${{ runner.temp }}/api-contract-report.md
          EVENT_REVIEW_AUTHOR_ASSOCIATION: ${{ github.event.review.author_association || '' }}
          EVENT_REVIEW_COMMIT_OID: ${{ github.event.review.commit_id || '' }}
          EVENT_REVIEW_STATE: ${{ github.event.review.state || '' }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/openapi/enforce-breaking-approval.sh
