name: CI Pipeline

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main, feat/75-challenge-delivery-foundation, recovery/78-registration-clean-20261031, fix/79-oauth-existing-links-only, feat/80-canonical-auth-context-foundation]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.pull_request.base.ref == 'dev' ||
      github.event.pull_request.base.ref == 'staging' ||
      github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'feat/75-challenge-delivery-foundation' ||
      github.event.pull_request.base.ref == 'recovery/78-registration-clean-20261031' ||
      github.event.pull_request.base.ref == 'fix/79-oauth-existing-links-only' ||
      github.event.pull_request.base.ref == 'feat/80-canonical-auth-context-foundation'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ohealth_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ohealth_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run supply-chain security scan
        shell: bash
        run: bash scripts/security/supply-chain-scan.sh

      - name: Verify supply-chain scanner controls
        shell: bash
        run: bash scripts/security/supply-chain-scan.test.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Verify pinned compromised-password dataset
        run: npm run password-blocklist:check

      - name: Check generated contract drift
        run: npm run contract:check

      - name: Install pinned API compatibility checker
        env:
          OASDIFF_INSTALL_DIR: ${{ runner.temp }}/oasdiff/bin
        run: |
          bash scripts/openapi/install-oasdiff.sh
          echo "${OASDIFF_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Validate canonical API contract
        run: npm run contract:validate

      - name: Verify contract compatibility controls
        run: npm run contract:compatibility:test

      - name: Verify generated API client
        run: npm run api-client:test

      - name: Analyze API contract changes
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        id: contract_compatibility
        env:
          BASE_CONTRACT: ${{ github.event.pull_request.base.sha }}:contracts/openapi.json
          CONTRACT_REPORT: ${{ runner.temp }}/api-contract-report.md
        run: |
          bash scripts/openapi/analyze-contract-change.sh \
            "${BASE_CONTRACT}" \
            contracts/openapi.json \
            "${CONTRACT_REPORT}"

      - name: Verify operator delivery command input and formatting
        run: |
          npx prettier --check scripts/maintenance/dispatch-auth-challenge-deliveries.ts
          check_invalid_usage() {
            set +e
            result=$(npm run auth-challenge-delivery:dispatch -- "$@" 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ] || ! printf '%s\n' "$result" | grep -qx 'Invalid challenge delivery dispatch arguments.'; then
              printf 'Delivery dispatch did not reject invalid arguments before database access.\n' >&2
              exit 1
            fi
          }
          check_invalid_usage --batch-size=0
          check_invalid_usage --batch-size=11
          check_invalid_usage --batch-size=NaN
          check_invalid_usage --unknown
          check_invalid_usage --batch-size=1 --batch-size=2

      - name: Verify formatting
        run: npm run format:check

      - name: Run non-mutating ESLint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Verify maintenance worker TypeScript and ESLint
        run: |
          npx tsc --noEmit -p tsconfig.worker.json
          npx eslint scripts/maintenance/dispatch-auth-challenge-deliveries.ts scripts/maintenance/prune-registration-retries.ts
          npx prettier --check scripts/maintenance/prune-registration-retries.ts

      - name: Run Tests
        run: npm test

      - name: Verify denied legacy activation (isolated e2e)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/auth-activation.e2e-spec.ts

      - name: Verify credential enumeration resistance (isolated e2e)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/auth-login-enumeration.e2e-spec.ts

      - name: Verify purpose-bound public auth contracts (isolated HTTP e2e)
        run: npx jest --config ./test/jest-e2e.json --runInBand test/auth-challenge-public.e2e-spec.ts

      - name: Run Build
        run: npm run build

      - name: Verify deployed worker image and email rendering
        run: |
          docker build -f deploy/auth-challenge-worker/Dockerfile -t ohealth-auth-worker:ci .
          docker run --rm --entrypoint node ohealth-auth-worker:ci scripts/maintenance/check-worker-templates.cjs

      - name: Verify account lifecycle migration on real PostgreSQL
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/canonical-account-lifecycle.integration.spec.ts

      - name: Verify auth security audit foundation on PostgreSQL
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/auth-security-audit.integration.spec.ts

      - name: Verify auth challenge foundation on PostgreSQL
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/auth-challenge.integration.spec.ts

      - name: Verify live challenge HTTP and PostgreSQL acceptance
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/auth-challenge-live-http.integration.spec.ts

      - name: Verify delivery lease safety across independent PostgreSQL connections
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/auth-challenge-delivery-concurrency.integration.spec.ts

      - name: Verify recovered registration persistence and uniqueness on PostgreSQL
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/normalized-signup-keys.integration.spec.ts src/database/tests/registration-records.integration.spec.ts

      - name: Verify recovered Google identity constraints and unlink audit
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/google-subject-unique.integration.spec.ts src/database/tests/oauth-unlink-security-audit.integration.spec.ts

      - name: Verify recovered patient profile address and persistence
        env:
          PG_INTEGRATION_URL: postgres://postgres:postgres@localhost:5432/ohealth_ci
        run: npx jest --runInBand src/database/tests/patient-personal-address.integration.spec.ts src/database/tests/canonical-patient-personal-profile.integration.spec.ts

      - name: Enforce breaking-change approval
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          APPROVAL_LABEL_PRESENT: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking-change-approved') }}
          BREAKING_CHANGES: ${{ steps.contract_compatibility.outputs.breaking_changes }}
          CONTRACT_REPORT: ${{ runner.temp }}/api-contract-report.md
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/openapi/enforce-breaking-approval.sh
